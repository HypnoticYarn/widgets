<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f8">
  <title>Jess's Monster Clock</title>
  <style>
:root {
  color-scheme: light;
  --ink: #44204f;
  --soft-ink: #76627e;
  --line: #dfd5e8;
  --leaf: #9758c1;
  --pink: #f8d4e8;
  --white: #fff;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  padding: 10px;
  background: transparent;
  color: var(--ink);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.widget {
  width: min(100%, 1050px);
  margin: auto;
  display: grid;
  grid-template-columns: minmax(290px, .92fr) minmax(390px, 1.08fr);
  gap: 12px;
}
.time-panel, .calendar-panel, .message-panel {
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 5px 22px rgba(83, 34, 103, .08);
  background: linear-gradient(145deg, #ffffff 55%, #eefbfc);
}
.time-panel {
  min-height: 330px;
  position: relative;
  overflow: hidden;
  padding: 27px 22px;
  text-align: center;
}
.eyebrow, .message-label {
  color: #9a3d83;
  font-size: 11px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .16em;
}
.leaf { color: #d52d93; font-size: 16px; vertical-align: -1px; margin-right: 4px; }
.time-row { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: 27px; }
.clock { font-family: "Trebuchet MS", ui-rounded, system-ui, sans-serif; font-size: clamp(50px, 6vw, 76px); letter-spacing: -.055em; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.period { font-size: 17px; font-weight: 700; color: #8a4aa4; }
.date { display: block; margin-top: 12px; font-size: 18px; font-weight: 600; }
.timezone { margin-top: 5px; color: var(--soft-ink); font-size: 12px; }
.monster-art {
  position: absolute;
  width: calc(100% - 34px);
  height: 101px;
  left: 17px;
  bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 5px;
}
.monster-art img { display: block; width: 32%; max-height: 100px; object-fit: contain; object-position: center bottom; }
.calendar-panel { padding: 20px 24px 21px; }
.calendar-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.calendar-heading h1 { margin: 0; font: normal 28px/1.2 "Trebuchet MS", ui-rounded, system-ui, sans-serif; letter-spacing: -.025em; }
.calendar-actions { display: flex; gap: 5px; align-items: center; }
button {
  border: 1px solid #ded1eb;
  border-radius: 10px;
  color: var(--ink);
  background: #f6f0fb;
  min-width: 29px;
  height: 30px;
  cursor: pointer;
  font-size: 20px;
  line-height: 1;
}
button:hover, button:focus-visible { background: #f0def9; outline-color: var(--leaf); }
#today-button { padding: 0 9px; font: 600 11px ui-sans-serif, system-ui, sans-serif; }
.weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
.weekdays { color: #876c94; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 8px; }
.calendar-grid { gap: 2px; }
.day { height: 33px; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; border-radius: 50%; }
.day.today { background: #ead5f8; color: #542372; font-weight: 800; box-shadow: inset 0 0 0 1px #ae75cd; }
.day.empty { visibility: hidden; }
.message-panel {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 17px;
  min-height: 103px;
  padding: 18px 24px;
  background: linear-gradient(105deg, #fde1ef 0%, #fdf8ff 36%, #eefbfc 100%);
  border-color: #e7c6e4;
}
.message-mark {
  flex: 0 0 auto;
  width: 51px; height: 51px;
  display: grid; place-items: center;
  background: #f5e9ff;
  border: 1px solid #d6b2e7;
  border-radius: 50%;
  color: #9c39b7;
  font: normal 28px "Trebuchet MS", sans-serif;
}
.message { margin: 6px 0 0; font: normal clamp(18px, 2.2vw, 24px)/1.25 "Trebuchet MS", ui-rounded, system-ui, sans-serif; }
.message-flower { margin-left: auto; color: #c997df; font-size: 23px; }
@media (max-width: 740px) {
  body { padding: 5px; }
  .widget { grid-template-columns: 1fr; gap: 8px; }
  .time-panel { min-height: 228px; padding: 18px 22px; }
  .time-row { margin-top: 15px; }
  .clock { font-size: 58px; }
  .monster-art { height: 72px; bottom: 3px; }
  .monster-art img { max-height: 72px; }
  .calendar-panel { padding: 17px 19px; }
  .message-panel { grid-column: 1; min-height: 105px; padding: 17px; }
  .message-flower { display: none; }
}
@media (max-width: 420px) {
  .calendar-heading h1 { font-size: 23px; }
  .calendar-panel { padding: 15px; }
  .day { height: 31px; }
}


/* Monster styling keeps the original clock/calendar layout. */
.calendar-heading h1 {font-weight:700;font-size:25px;}
.clock {font-weight:750;letter-spacing:-.05em;}
.message-content {min-width:0;flex:1;}
.message-mark {border:0;background:transparent;width:62px;height:62px;}
.message-mark img {width:100%;height:100%;object-fit:contain;}
.message {font-weight:600;font-size:20px;line-height:1.4;margin:0;white-space:nowrap;}
.ticker-window {overflow:hidden;margin-top:8px;}
.ticker-track {display:flex;width:max-content;animation:pep-scroll 32s linear infinite;}
.ticker-track .message {padding-right:72px;}
.message-panel:hover .ticker-track,.paused .ticker-track {animation-play-state:paused;}
#pause-note {font:600 11px system-ui,sans-serif;padding:0 10px;flex-shrink:0;}
#pause-note:focus-visible {outline:2px solid #9758c1;outline-offset:3px;}
@keyframes pep-scroll {from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (max-width:740px) {.time-panel{min-height:255px}.monster-art{height:83px;bottom:8px}.monster-art img{max-height:83px}.message-panel{gap:10px}.message{font-size:17px}.message-mark{width:43px;height:43px}}
@media (max-width:360px) {.calendar-heading{flex-wrap:wrap}.calendar-heading h1{font-size:21px}.message-panel{padding:12px;gap:7px}}
@media (prefers-reduced-motion:reduce) {.ticker-track{animation:none;width:auto}.ticker-track .message{white-space:normal;padding-right:0}#message-copy,#pause-note{display:none}}
</style>
</head>

      <div class="message-content">
        <div class="message-label">Your daily monster pep talk</div>
        <div class="ticker-window"><div class="ticker-track"><p id="message" class="message"></p><p id="message-copy" class="message" aria-hidden="true"></p></div></div>
      </div>
      <button id="pause-note" type="button" aria-label="Pause scrolling pep talk" aria-pressed="false">Pause</button>
    </section>
  </main>
  <script>
const TIME_ZONE = "America/New_York";
const clock = document.querySelector("#clock");
const period = document.querySelector("#period");
const date = document.querySelector("#date");
const monthTitle = document.querySelector("#month");
const calendar = document.querySelector("#calendar");
const message = document.querySelector("#message");

let viewYear;
let viewMonth;
let followingCurrentMonth = true;
let lastDateKey = "";

function zonedParts(now = new Date()) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: TIME_ZONE,
    year: "numeric", month: "numeric", day: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true
  }).formatToParts(now);
  return Object.fromEntries(parts.filter(p => p.type !== "literal").map(p => [p.type, p.value]));
}

function renderCalendar(year, month, today) {
  monthTitle.textContent = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric", timeZone: "UTC" })
    .format(new Date(Date.UTC(year, month, 1)));
  calendar.replaceChildren();
  const firstDay = new Date(Date.UTC(year, month, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement("span");
    cell.className = "day empty";
    cell.setAttribute("aria-hidden", "true");
    calendar.append(cell);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement("span");
    const isToday = year === today.year && month === today.month && day === today.day;
    cell.className = "day" + (isToday ? " today" : "");
    cell.textContent = day;
    cell.setAttribute("role", "gridcell");
    cell.setAttribute("aria-label", new Intl.DateTimeFormat("en-US", { dateStyle: "full", timeZone: "UTC" })
      .format(new Date(Date.UTC(year, month, day))) + (isToday ? ", today" : ""));
    if (isToday) cell.setAttribute("aria-current", "date");
    calendar.append(cell);
  }
}

const PEP_TALKS = ["Tiny steps. Monster-sized progress.", "You don’t need eight arms. One thing at a time will do.", "Bring your big ideas. Your tiny horns are a bonus.", "A little focus, a little fluff, a lot of possibility.", "Your to-do list has met its monster.", "Coffee helps. Your brilliant brain does the real work.", "Small wins deserve a very enthusiastic monster high-five.", "Even the fluffiest plans start with one next step.", "You’re allowed to be a work in progress with excellent horns.", "Today’s mission: make progress and keep your sense of humor.", "Big task? Take a tiny monster bite.", "You bring the ideas. The monsters brought the clipboards.", "You can be capable and a little chaotic. Ask any monster.", "One checked box is a perfectly good beginning.", "Deep breath. Shoulders down. Horns up.", "Your best work needs breathing room. Take a little space.", "Progress counts, even when your sticky notes disagree.", "A fresh start fits on a very small piece of paper.", "Put your energy into the next step. The whole mountain can wait.", "Make something useful. Add a little mischief.", "You’ve handled tricky things before. This monster believes in you.", "Your ideas don’t have to be perfect to be worth trying.", "Less overwhelm. More one-thing-at-a-time energy.", "The clipboard is impressed. Keep going at your own pace.", "Good things take time, even with a monster on the team.", "You are more than your finished tasks. The monsters insist.", "Rest is part of the plan. Even monsters recharge.", "Let the small wins stack up like very satisfying little folders.", "Ask for a hand. The monster crew has a few to spare.", "Today can hold both useful work and a little joy.", "Keep your goals big and your next step small."];
function dailyMessage(today) {
  const dayIndex = Math.floor(Date.UTC(today.year, today.month, today.day) / 86400000);
  return PEP_TALKS[((dayIndex % PEP_TALKS.length) + PEP_TALKS.length) % PEP_TALKS.length];
}

function refresh() {
  const now = new Date();
  const p = zonedParts(now);
  const today = { year: +p.year, month: +p.month - 1, day: +p.day };
  clock.textContent = `${p.hour}:${p.minute}`;
  period.textContent = p.dayPeriod;
  clock.setAttribute("datetime", now.toISOString());
  date.textContent = new Intl.DateTimeFormat("en-US", {
    timeZone: TIME_ZONE, month: "long", day: "numeric", year: "numeric"
  }).format(now);
  date.setAttribute("datetime", `${p.year}-${p.month.padStart(2, "0")}-${p.day.padStart(2, "0")}`);
  const key = `${p.year}-${p.month}-${p.day}`;
  if (key !== lastDateKey) {
    lastDateKey = key;
    message.textContent = dailyMessage(today);
    document.querySelector("#message-copy").textContent = message.textContent;
    if (followingCurrentMonth || viewYear === undefined) {
      viewYear = today.year;
      viewMonth = today.month;
    }
    renderCalendar(viewYear, viewMonth, today);
  }
}

function changeMonth(offset) {
  const d = new Date(Date.UTC(viewYear, viewMonth + offset, 1));
  viewYear = d.getUTCFullYear();
  viewMonth = d.getUTCMonth();
  followingCurrentMonth = false;
  const p = zonedParts();
  renderCalendar(viewYear, viewMonth, { year: +p.year, month: +p.month - 1, day: +p.day });
}
document.querySelector("#previous").addEventListener("click", () => changeMonth(-1));
document.querySelector("#next").addEventListener("click", () => changeMonth(1));
document.querySelector("#today-button").addEventListener("click", () => {
  followingCurrentMonth = true;
  const p = zonedParts();
  viewYear = +p.year; viewMonth = +p.month - 1;
  renderCalendar(viewYear, viewMonth, { year: +p.year, month: +p.month - 1, day: +p.day });
});
document.querySelector("#pause-note").addEventListener("click", event => {
  const paused = document.querySelector(".message-panel").classList.toggle("paused");
  event.currentTarget.textContent = paused ? "Play" : "Pause";
  event.currentTarget.setAttribute("aria-pressed", String(paused));
  event.currentTarget.setAttribute("aria-label", (paused ? "Resume" : "Pause") + " scrolling pep talk");
});
refresh();
setInterval(refresh, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

</script>
