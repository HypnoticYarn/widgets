<title>Zodiac Sales So Far</title>
<style>
:root{color-scheme:light;--ink:#365444;--muted:#708875;--line:#dbe8de;--pink:#f3dce3;--leaf:#7ca589}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{padding:8px;background:transparent;color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.widget{width:100%;min-height:284px;padding:22px 24px 20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#fff 65%,#f8fbf8);box-shadow:0 5px 22px rgb(70 103 75 / 6%);overflow:hidden}
.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;height:88px;margin-bottom:16px}
.heading-copy{min-width:0;position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 9px;color:#658570;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.17em}
.sparkle{color:#b67790;font-size:17px;line-height:1}
h1{margin:0;font:normal clamp(22px,2.7vw,34px)/1.2 Georgia,"Times New Roman",serif;letter-spacing:-.025em;text-wrap:balance}
.art{display:block;width:220px;height:104px;object-fit:contain;flex-shrink:0;mix-blend-mode:multiply}
.metrics{display:grid;grid-template-columns:minmax(130px,.75fr) repeat(2,minmax(165px,1fr)) minmax(180px,1.13fr);gap:12px}
.card{min-width:0;min-height:130px;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#fff,#fbfdfb);position:relative}
.card h2{font-size:12px;font-weight:650;margin:0 0 12px;line-height:1.25}
.card .weight{font-weight:450;color:var(--muted);margin-left:3px;white-space:nowrap}
.stat{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;line-height:1.05}
.number{font:normal 32px/1.05 Georgia,"Times New Roman",serif;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.025em;overflow-wrap:anywhere}
.unit{font-size:11px;color:var(--muted)}
.revenue{margin-top:9px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.revenue .unit{font-weight:400}
.signs{background:linear-gradient(140deg,#f8fbf8,#fff)}
.signs .number{font-size:40px}
.signs .unit{display:block;margin-top:7px;line-height:1.4}
.total{border-color:#eacdd8;background:linear-gradient(120deg,#f9e9ee,#fff8fa 80%);box-shadow:0 2px 8px rgb(174 107 134 / 5%)}
.total h2{color:#815e70}
.total .unit{color:#806a76}
.total .revenue{font-size:19px}
.empty{color:var(--muted)}
@media(min-width:1400px){.widget{padding-inline:30px}.heading{height:92px}.card{padding:19px 22px}.metrics{gap:16px}.number{font-size:36px}.art{width:260px}.revenue{font-size:20px}}
@media(max-width:820px){.widget{padding:17px 18px}.heading{height:auto;min-height:75px;margin-bottom:14px}.art{width:165px;height:85px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:116px;padding:14px 16px}.card h2{margin-bottom:9px}.number{font-size:29px}.signs .number{font-size:34px}.revenue{margin-top:7px}.signs .unit{margin-top:4px}}
@media(max-width:470px){body{padding:5px}.widget{padding:16px 13px;border-radius:18px}.heading{gap:5px;margin-bottom:14px}.eyebrow{font-size:9px;letter-spacing:.12em}h1{font-size:23px}.art{width:100px;height:74px}.card{padding:12px 11px;min-height:115px}.card h2{font-size:11px}.card .weight{display:block;margin:3px 0 0}.number{font-size:27px}.revenue,.total .revenue{font-size:16px}.revenue .unit{font-size:10px}.unit{font-size:10px}}
@media(max-width:300px){.art{display:none}.metrics{grid-template-columns:1fr}}
</style>
</head>

<section class="metrics" aria-label="Year-to-date Zodiac sales">
<article class="card signs"><h2>Signs released so far</h2><div class="number" id="signs">—</div><span class="unit">signs released</span></article>
<article class="card"><h2>Plush Sock <span class="weight">100g</span></h2><div class="stat"><span class="number" id="ps-skeins">—</span><span class="unit">skeins</span></div><div class="revenue"><span id="ps-revenue">—</span><span class="unit">revenue</span></div></article>
<article class="card"><h2>Plush DK <span class="weight">100g</span></h2><div class="stat"><span class="number" id="dk-skeins">—</span><span class="unit">skeins</span></div><div class="revenue"><span id="dk-revenue">—</span><span class="unit">revenue</span></div></article>
<article class="card total"><h2>Combined total</h2><div class="stat"><span class="number" id="total-skeins">—</span><span class="unit">skeins</span></div><div class="revenue"><span id="total-revenue">—</span><span class="unit">revenue</span></div></article>
</section>

<script>
/* All sales figures come from the query string of this file's own URL.
   Accepted keys: year, signs, ps_skeins, ps_rev, dk_skeins, dk_rev.
   Empty, missing, negative, or malformed inputs display an em dash.
   Counts must be whole numbers. Revenue may have up to two decimal places.
   Each combined total requires both of its corresponding weight values. */
(() => {
  'use strict';
  const params = new URLSearchParams(window.location.search);
  const dash = '—';
  const countFormat = new Intl.NumberFormat('en-US');
  function raw(key) { const value=params.get(key); return value===null?null:value.trim(); }
  function count(key) {
    const value=raw(key);
    return value!==null && /^\d{1,30}$/.test(value) ? BigInt(value) : null;
  }
  function cents(key) {
    const value=raw(key);
    if(value===null || !/^\d{1,30}(?:\.\d{1,2})?$/.test(value)) return null;
    const [whole, fraction='']=value.split('.');
    return BigInt(whole)*100n+BigInt(fraction.padEnd(2,'0'));
  }
  function dollars(value) {
    return value===null ? dash : '$'+countFormat.format(value/100n)+'.'+String(value%100n).padStart(2,'0');
  }
  function sum(a,b) { return a===null || b===null ? null : a+b; }
  function show(id,value) {
    const element=document.getElementById(id);
    element.textContent=value;
    element.classList.toggle('empty',value===dash);
    if(value===dash) element.setAttribute('aria-label','Not provided');
  }
  const year=raw('year');
  const displayedYear=year!==null && /^\d{4}$/.test(year) ? year : dash;
  show('year',displayedYear);
  document.title=displayedYear+' Zodiac Sales So Far';
  const sock=count('ps_skeins'), dk=count('dk_skeins');
  const sockRevenue=cents('ps_rev'), dkRevenue=cents('dk_rev');
  const signs=count('signs');
  show('signs',signs===null?dash:countFormat.format(signs));
  show('ps-skeins',sock===null?dash:countFormat.format(sock));
  show('dk-skeins',dk===null?dash:countFormat.format(dk));
  show('ps-revenue',dollars(sockRevenue));
  show('dk-revenue',dollars(dkRevenue));
  const totalSkeins=sum(sock,dk);
  show('total-skeins',totalSkeins===null?dash:countFormat.format(totalSkeins));
  show('total-revenue',dollars(sum(sockRevenue,dkRevenue)));
})();
</script>
