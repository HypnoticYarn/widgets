<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7fbf7">
  <title>Garden Clock</title>
  <style>
:root {
  color-scheme: light;
  --ink: #365444;
  --soft-ink: #708875;
  --line: #dbe8de;
  --leaf: #7ca589;
  --pink: #f3dce3;
  --white: #fff;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  padding: 10px;
  background: transparent;
  color: var(--ink);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.widget {
  width: min(100%, 1050px);
  margin: auto;
  display: grid;
  grid-template-columns: minmax(290px, .92fr) minmax(390px, 1.08fr);
  gap: 12px;
}
.time-panel, .calendar-panel, .message-panel {
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 5px 22px rgba(70, 103, 75, .06);
  background: linear-gradient(145deg, #ffffff 55%, #f8fbf8);
}
.time-panel {
  min-height: 330px;
  position: relative;
  overflow: hidden;
  padding: 27px 22px;
  text-align: center;
}
.eyebrow, .message-label {
  color: #72967d;
  font-size: 11px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .16em;
}
.leaf { color: #d782a5; font-size: 16px; vertical-align: -1px; margin-right: 4px; }
.time-row { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: 27px; }
.clock { font-family: Georgia, "Times New Roman", serif; font-size: clamp(50px, 6vw, 76px); letter-spacing: -.055em; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.period { font-size: 17px; font-weight: 700; color: #799583; }
.date { display: block; margin-top: 12px; font-size: 18px; font-weight: 600; }
.timezone { margin-top: 5px; color: var(--soft-ink); font-size: 12px; }
.garden-art {
  position: absolute;
  width: calc(100% - 34px);
  height: 101px;
  left: 17px;
  bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 5px;
}
.garden-art img { display: block; width: 24%; max-height: 100px; object-fit: contain; object-position: center bottom; }
.calendar-panel { padding: 20px 24px 21px; }
.calendar-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.calendar-heading h1 { margin: 0; font: normal 28px/1.2 Georgia, "Times New Roman", serif; letter-spacing: -.025em; }
.calendar-actions { display: flex; gap: 5px; align-items: center; }
button {
  border: 1px solid #dbe7dd;
  border-radius: 10px;
  color: var(--ink);
  background: #f9fcf9;
  min-width: 29px;
  height: 30px;
  cursor: pointer;
  font-size: 20px;
  line-height: 1;
}
button:hover, button:focus-visible { background: #ecf5ed; outline-color: var(--leaf); }
#today-button { padding: 0 9px; font: 600 11px ui-sans-serif, system-ui, sans-serif; }
.weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
.weekdays { color: #8ba294; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 8px; }
.calendar-grid { gap: 2px; }
.day { height: 33px; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; border-radius: 50%; }
.day.today { background: #e7f0e8; color: #315e40; font-weight: 800; box-shadow: inset 0 0 0 1px #b9d7be; }
.day.empty { visibility: hidden; }
.message-panel {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 17px;
  min-height: 103px;
  padding: 18px 24px;
  background: linear-gradient(105deg, #f9e9ee 0%, #fffafc 36%, #f8fbf8 100%);
  border-color: #efdae2;
}
.message-mark {
  flex: 0 0 auto;
  width: 51px; height: 51px;
  display: grid; place-items: center;
  background: #fff9fb;
  border: 1px solid #f1d7e1;
  border-radius: 50%;
  color: #d688a5;
  font: normal 28px Georgia, serif;
}
.message { margin: 6px 0 0; font: normal clamp(18px, 2.2vw, 24px)/1.25 Georgia, "Times New Roman", serif; }
.message-flower { margin-left: auto; color: #e9bdcb; font-size: 23px; }
@media (max-width: 740px) {
  body { padding: 5px; }
  .widget { grid-template-columns: 1fr; gap: 8px; }
  .time-panel { min-height: 228px; padding: 18px 22px; }
  .time-row { margin-top: 15px; }
  .clock { font-size: 58px; }
  .garden-art { height: 72px; bottom: 3px; }
  .garden-art img { max-height: 72px; }
  .calendar-panel { padding: 17px 19px; }
  .message-panel { grid-column: 1; min-height: 105px; padding: 17px; }
  .message-flower { display: none; }
}
@media (max-width: 420px) {
  .calendar-heading h1 { font-size: 23px; }
  .calendar-panel { padding: 15px; }
  .day { height: 31px; }
}

</style>
</head>

    <section class="calendar-panel" aria-label="Monthly calendar">
      <div class="calendar-heading">
        <h1 id="month"></h1>
        <div class="calendar-actions">
          <button id="previous" type="button" aria-label="Previous month">‹</button>
          <button id="today-button" type="button">Today</button>
          <button id="next" type="button" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div id="calendar" class="calendar-grid" role="grid" aria-label="Dates in the displayed month"></div>
    </section>

    <section class="message-panel" aria-label="Today's message">
      <div class="message-mark" aria-hidden="true">♡</div>
      <div>
        <div class="message-label">A note for today</div>
        <p id="message" class="message"></p>
      </div>
      <div class="message-flower" aria-hidden="true">✿</div>
    </section>
  </main>
  <script>
const TIME_ZONE = "America/New_York";
const clock = document.querySelector("#clock");
const period = document.querySelector("#period");
const date = document.querySelector("#date");
const monthTitle = document.querySelector("#month");
const calendar = document.querySelector("#calendar");
const message = document.querySelector("#message");

let viewYear;
let viewMonth;
let followingCurrentMonth = true;
let lastDateKey = "";

function zonedParts(now = new Date()) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: TIME_ZONE,
    year: "numeric", month: "numeric", day: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true
  }).formatToParts(now);
  return Object.fromEntries(parts.filter(p => p.type !== "literal").map(p => [p.type, p.value]));
}

function renderCalendar(year, month, today) {
  monthTitle.textContent = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric", timeZone: "UTC" })
    .format(new Date(Date.UTC(year, month, 1)));
  calendar.replaceChildren();
  const firstDay = new Date(Date.UTC(year, month, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement("span");
    cell.className = "day empty";
    cell.setAttribute("aria-hidden", "true");
    calendar.append(cell);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement("span");
    const isToday = year === today.year && month === today.month && day === today.day;
    cell.className = "day" + (isToday ? " today" : "");
    cell.textContent = day;
    cell.setAttribute("role", "gridcell");
    cell.setAttribute("aria-label", new Intl.DateTimeFormat("en-US", { dateStyle: "full", timeZone: "UTC" })
      .format(new Date(Date.UTC(year, month, day))) + (isToday ? ", today" : ""));
    if (isToday) cell.setAttribute("aria-current", "date");
    calendar.append(cell);
  }
}

function dailyMessage(today) {
  const weekday = new Date(Date.UTC(today.year, today.month, today.day)).getUTCDay();
  const names = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const rest = {
    5: "The week can end softly. Take a breath and let yourself slow down.",
    6: "Make room for rest, small joys, and a little time just for you.",
    0: "A gentle day is time well spent. Rest before the week begins again."
  };
  return rest[weekday] || `On ${names[weekday]}, we do ${names[weekday]} things.`;
}

function refresh() {
  const now = new Date();
  const p = zonedParts(now);
  const today = { year: +p.year, month: +p.month - 1, day: +p.day };
  clock.textContent = `${p.hour}:${p.minute}`;
  period.textContent = p.dayPeriod;
  clock.setAttribute("datetime", now.toISOString());
  date.textContent = new Intl.DateTimeFormat("en-US", {
    timeZone: TIME_ZONE, month: "long", day: "numeric", year: "numeric"
  }).format(now);
  date.setAttribute("datetime", `${p.year}-${p.month.padStart(2, "0")}-${p.day.padStart(2, "0")}`);
  const key = `${p.year}-${p.month}-${p.day}`;
  if (key !== lastDateKey) {
    lastDateKey = key;
    message.textContent = dailyMessage(today);
    if (followingCurrentMonth || viewYear === undefined) {
      viewYear = today.year;
      viewMonth = today.month;
    }
    renderCalendar(viewYear, viewMonth, today);
  }
}

function changeMonth(offset) {
  const d = new Date(Date.UTC(viewYear, viewMonth + offset, 1));
  viewYear = d.getUTCFullYear();
  viewMonth = d.getUTCMonth();
  followingCurrentMonth = false;
  const p = zonedParts();
  renderCalendar(viewYear, viewMonth, { year: +p.year, month: +p.month - 1, day: +p.day });
}
document.querySelector("#previous").addEventListener("click", () => changeMonth(-1));
document.querySelector("#next").addEventListener("click", () => changeMonth(1));
document.querySelector("#today-button").addEventListener("click", () => {
  followingCurrentMonth = true;
  const p = zonedParts();
  viewYear = +p.year; viewMonth = +p.month - 1;
  renderCalendar(viewYear, viewMonth, { year: +p.year, month: +p.month - 1, day: +p.day });
});
refresh();
setInterval(refresh, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

</script>
